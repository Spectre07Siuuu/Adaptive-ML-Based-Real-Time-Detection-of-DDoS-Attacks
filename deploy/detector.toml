# Live detector settings (ddos.realtime.detector --config deploy/detector.toml).
# Every key is a command-line option with '-' written as '_'; the command line wins.

iface = "s1-eth1"            # switch port facing the protected server
victim = "10.0.0.100"        # protected server; never blocked
switch = "s1"                # OVS bridge that receives the drop flows
whitelist = []               # other addresses that must never be blocked (gateways, monitoring)

model = "models/detector.joblib"
threshold = 0.5              # supervised score that flags a window
consecutive = 2              # flagged windows in a row before a peer is blocked
block_seconds = 60           # OVS lifts the block after this; a peer still attacking is blocked again

mode = "hybrid"              # "supervised", or "hybrid" = supervised or novelty
calibrate = 300              # seconds of traffic that define normal; shorter misses periodic jobs (backups, transfers)
adaptive = true              # retrain on pseudo-labels from the novelty detector
retrain_seconds = 600

log = "/var/log/ddos-detector/detector.jsonl"
scores = "/var/log/ddos-detector/scores.csv"
